name: CI

on:
  push:
    branches: ["master", "develop", "feature/**", "release/**", "hotfix/**"]
    tags: ["*"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the Windows build separate so we still validate the .NET Framework target
  # and the packaging prerequisites that only exist on Windows runners.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore ./src/NEventStore.Persistence.MongoDB.Core.sln --verbosity m

      - name: Run GitVersion and patch assembly info
        id: gitversion
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $gitVersion = dotnet tool run dotnet-gitversion /targetpath "${{ github.workspace }}" /output json /updateAssemblyInfo | ConvertFrom-Json
          dotnet tool run dotnet-gitversion /targetpath "${{ github.workspace }}/dependencies/NEventStore" /updateAssemblyInfo | Out-Null
          "semver=$($gitVersion.SemVer)" >> $env:GITHUB_OUTPUT

      - name: Build solution
        run: dotnet build ./src/NEventStore.Persistence.MongoDB.Core.sln -c Release --no-restore /p:ContinuousIntegrationBuild=True

      - name: Test dependency verification guards
        shell: pwsh
        run: ./scripts/test-verify-driver-dependencies.ps1

      - name: Verify production and default test restore
        shell: pwsh
        run: ./scripts/verify-driver-dependencies.ps1 -TestDriverVersion '3.13.0'

      - name: Pack and verify published dependency contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nuget pack ./src/.nuget/NEventStore.Persistence.MongoDB.nuspec -properties "version=${{ steps.gitversion.outputs.semver }};configuration=Release" -OutputDirectory artifacts
          if ($LASTEXITCODE -ne 0) { throw 'NuGet pack failed.' }
          $package = Get-ChildItem artifacts -Filter '*.nupkg' | Select-Object -First 1
          ./scripts/verify-driver-dependencies.ps1 -PackagePath $package.FullName -RestoreConsumer

  # Tests run on Linux because this repository needs a live MongoDB instance and
  # GitHub Actions service containers are only available on Linux runners.
  # Each framework/driver pair restores and builds in a separate job.
  test-modern-tfm-linux:
    name: Test (Linux, ${{ matrix.tfm }}, Driver ${{ matrix.driver }}, MongoDB ${{ matrix.mongodb }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin both lanes; update the current 3.x pin in reviewed changes.
        driver: ["3.0.0", "3.13.0"]
        mongodb: ["7.0.45"]
        tfm:
          - net8.0
          - net9.0
          - net10.0
        include:
          # Retain current-server coverage with the current driver only.
          - tfm: net10.0
            driver: "3.13.0"
            mongodb: "9.0.4"

    services:
      # The test project reads NEventStore.MongoDB from the environment and expects
      # a real MongoDB server. This sidecar provides that dependency for each matrix leg.
      mongodb:
        # MongoDB 7 supports both lanes and avoids the MongoDB 8/Linux 6.19
        # startup incompatibility: https://jira.mongodb.org/browse/SERVER-121912
        image: mongo:${{ matrix.mongodb }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10

    env:
      # Match the connection-string convention used by the acceptance tests.
      NEventStore.MongoDB: mongodb://127.0.0.1:27017/NEventStore

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore selected test driver
        run: dotnet restore ./src/NEventStore.Persistence.MongoDB.Tests/NEventStore.Persistence.MongoDB.Core.Tests.csproj -p:MongoDbDriverTestVersion=${{ matrix.driver }}

      - name: Verify restored driver and BSON versions
        shell: pwsh
        run: ./scripts/verify-driver-dependencies.ps1 -TestDriverVersion '${{ matrix.driver }}'

      - name: Run tests for ${{ matrix.tfm }} with Driver ${{ matrix.driver }}
        # Both driver lanes execute the same complete acceptance and regression suite.
        run: dotnet test ./src/NEventStore.Persistence.MongoDB.Tests/NEventStore.Persistence.MongoDB.Core.Tests.csproj -c Release -f ${{ matrix.tfm }} --no-restore -p:MongoDbDriverTestVersion=${{ matrix.driver }} --logger "trx;LogFileName=test-results-${{ matrix.tfm }}-${{ matrix.driver }}-${{ matrix.mongodb }}.trx"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.tfm }}-${{ matrix.driver }}-${{ matrix.mongodb }}
          path: "**/test-results-${{ matrix.tfm }}-${{ matrix.driver }}-${{ matrix.mongodb }}.trx"
          if-no-files-found: error
          retention-days: 14
